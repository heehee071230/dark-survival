<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다크 서바이벌 - 계정 연동 멀티</title>
    <style>
        /* 모바일 화면에서 여백 없이 꽉 차게 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        h2 {
            margin: 10px 0;
            color: #ff4444;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .box-container {
            background: #1a1a1a;
            padding: 25px 20px;
            border: 2px solid #ff4444;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
            width: 85%;
            max-width: 320px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background 0.2s;
        }

        button:active {
            background-color: #cc2222;
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #333;
            border: 1px solid #555;
        }

        .btn-secondary:active {
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="box-container">
        <h2>DARK SURVIVAL</h2>
        <p>다크 서바이벌 멀티플레이어</p>
        
        <div id="status-text" style="font-size: 12px; color: #ffaa00; margin-bottom: 15px;">
            ⚠️ 로그인되지 않음 (게스트 모드)
        </div>

        <button onclick="startGame()">게임 시작</button>
        <button class="btn-secondary" onclick="openLogin()">계정 로그인</button>
        <button class="btn-secondary" onclick="openSettings()">설정</button>
    </div>

    <script>
        function startGame() {
            alert("게임을 시작합니다!");
        }

        function openLogin() {
            alert("로그인 기능 준비 중입니다.");
        }

        function openSettings() {
            alert("설정 화면 준비 중입니다.");
        }
    </script>

</body>
</html>
