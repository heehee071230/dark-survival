<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>멀티플레이어 웹 게임</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #222; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .hidden { display: none !important; }
        #auth-container { background: #333; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-top: 30px; width: 340px; }
        #game-container { width: 1120px; display: flex; gap: 20px; margin-top: 0; background: #333; padding: 20px; border-radius: 8px; align-items: flex-start; }
        canvas { background: #111; border: 2px solid #555; display: block; }
        .sidebar { display: flex; flex-direction: column; width: 280px; gap: 8px; }
        
        /* 토글 박스: 기본 여백을 헤더에 맞추고 내용이 열릴 때만 패딩 적용 */
        .toggle-box { background: #222; border: 1px solid #444; border-radius: 4px; overflow: hidden; }
        .toggle-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 14px; padding: 10px; background: #2a2a2a; }
        .toggle-header:hover { background: #333; }
        .toggle-content { padding: 10px; border-top: 1px solid #444; }
        
        #chat-box { height: 180px; background: #1a1a1a; border: 1px solid #444; overflow-y: scroll; padding: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
        #user-list { height: 100px; background: #1a1a1a; border: 1px solid #444; overflow-y: scroll; padding: 8px; font-size: 13px; margin: 0; list-style: none; }
        
        input, button { padding: 8px; margin: 4px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        input[type="text"], input[type="password"] { width: 100%; }
        button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #45a049; }
        
        .row { display: flex; gap: 5px; align-items: center; }
        .row input { flex: 1; }
        .row button { width: 90px; font-size: 12px; }
        .tab-container { display: flex; margin-bottom: 15px; border-bottom: 2px solid #555; }
        .tab-btn { flex: 1; padding: 10px; background: none; color: #aaa; border: none; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: #fff; border-bottom: 3px solid #4CAF50; background: #2a2a2a; }
        .rule-text { font-size: 11px; color: #aaa; margin-bottom: 5px; line-height: 1.3; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('login')">로그인</button>
            <button class="tab-btn" onclick="switchTab('register')">회원가입</button>
        </div>

        <!-- 로그인 폼 -->
        <div id="login-form">
            <h3>🔐 로그인</h3>
            <input type="text" id="login-username" placeholder="아이디"><br>
            <div class="row">
                <input type="password" id="login-password" placeholder="비밀번호">
                <button type="button" onclick="togglePassword('login-password', this)" style="background:#555;">보기</button>
            </div>
            <button id="login-btn" style="margin-top: 10px;">로그인하기</button>
        </div>

        <!-- 회원가입 폼 -->
        <div id="register-form" class="hidden">
            <h3>📝 회원가입</h3>
            <div class="row">
                <input type="text" id="reg-username" placeholder="아이디 입력">
                <button type="button" onclick="checkUsername()">중복확인</button>
            </div>
            <p id="id-check-msg" class="rule-text" style="color: #ff5252;"></p>

            <div class="row">
                <input type="password" id="reg-password" placeholder="비밀번호 (영문,숫자,특수문자 포함 8자 이상)">
                <button type="button" onclick="togglePassword('reg-password', this)" style="background:#555;">보기</button>
            </div>

            <div class="row" style="margin-top: 4px;">
                <input type="password" id="reg-password-confirm" placeholder="비밀번호 확인">
                <button type="button" onclick="togglePassword('reg-password-confirm', this)" style="background:#555;">보기</button>
            </div>
            <p id="pw-match-msg" class="rule-text" style="color: #ff5252;"></p>

            <button id="register-btn" style="margin-top: 5px;">회원가입하기</button>
        </div>

        <p id="auth-msg" style="color: yellow; font-size: 13px; margin-top: 10px; min-height: 20px; text-align: center;"></p>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="game-container" class="hidden">
        <div>
            <h3 id="current-map-title">현재 맵: 맵 1</h3>
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <p style="font-size: 12px; color: #aaa; margin-top: 8px;">조작법: 방향키 또는 W, A, S, D</p>
        </div>

        <div class="sidebar">
            <!-- 1. 맵 이동 창 (접기/펼치기) -->
            <div class="toggle-box">
                <div class="toggle-header" onclick="toggleSection('map-section', this)">
                    <span>🗺️ 맵 이동 메뉴</span>
                    <span>▶</span>
                </div>
                <div id="map-section" class="toggle-content hidden">
                    <div style="display: flex; gap: 5px; flex-direction: column;">
                        <button onclick="changeMap('map1')">맵 1로 이동</button>
                        <button onclick="changeMap('map2')">맵 2로 이동</button>
                    </div>
                </div>
            </div>

            <!-- 2. 접속자 목록 창 (접기/펼치기) -->
            <div class="toggle-box">
                <div class="toggle-header" onclick="toggleSection('user-section', this)">
                    <span>👥 접속자 목록 (<span id="user-count">0</span>명)</span>
                    <span>▶</span>
                </div>
                <div id="user-section" class="toggle-content hidden">
                    <ul id="user-list"></ul>
                </div>
            </div>

            <!-- 3. 실시간 채팅 창 (접기/펼치기) -->
            <div class="toggle-box">
                <div class="toggle-header" onclick="toggleSection('chat-section', this)">
                    <span>💬 실시간 채팅</span>
                    <span>▶</span>
                </div>
                <div id="chat-section" class="toggle-content hidden">
                    <div id="chat-box"></div>
                    <input type="text" id="chat-input" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="maps/map1.js?v=3"></script>
    <script src="maps/map2.js?v=3"></script>
    <script src="mapsManager.js?v=3"></script>
    <script src="client.js?v=1000"></script>
</body>
</html>
